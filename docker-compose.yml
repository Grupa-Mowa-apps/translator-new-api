services:
  postgres:
    container_name: container-pg
    image: postgres:16
    ports: 
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: root
      POSTGRES_DB: translator_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck: 
      test: ["CMD-SHELL", "pg_isready -U admin -d postgres -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      
  pgadmin:
    container_name: container-pgadmin
    image: dpage/pgadmin4
    depends_on:
      - postgres
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: root
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    working_dir: /app/backend
    command: uvicorn app.run:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
    depends_on:
      - postgres
    env_file:
      - ./backend/.env
    environment:
      PYTHONPATH: /app/backend/src
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: translator_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: root
      FILE_STORAGE_DIR: /app/backend/storage

# frontend:

volumes:
  postgres-data: