name: 🛠️ Build Dev Docker Image

on:
  push:
    branches-ignore:
      - main
      - release/**

permissions:
  contents: read
  packages: write

jobs:
  build-dev:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set branch tag
        run: echo "BRANCH_TAG=$(echo ${GITHUB_REF##*/} | tr '/' '-')" >> $GITHUB_ENV

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/translator-backend:${{ env.BRANCH_TAG }}-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push nginx image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.nginx
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/translator-nginx:${{ env.BRANCH_TAG }}-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
